<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Task Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Asimovian&family=Shadows+Into+Light&display=swap" rel="stylesheet">
    <link href="app.css" rel="stylesheet">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-6E23RMQB0X"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-6E23RMQB0X');
    </script>
</head>
<body>
    <script>
    if (localStorage.getItem('dark_mode') === '1')
        document.body.classList.add('dark');
    </script>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <button class="sidebar-toggle" id="sidebarToggle">
            <i style="font-size: 18px;"  class="bi bi-list"></i>
        </button>
        <span class="sidebar-title"></span>
    </div>
    
    <nav class="sidebar-nav">
        <button class="sidebar-item active" data-project="">
            <i style="font-size: 16px;" class="bi bi-collection"></i>
            <span style="font-size: 14px;">Todas as Tarefas</span>
        </button>
        
        <div class="sidebar-divider"></div>
        
        <div class="sidebar-section-header">
            <span>Projetos</span>
            <button class="sidebar-add-btn" id="addProjectBtn">
                <i style="font-size: 16px;" class="bi bi-plus"></i>
            </button>
        </div>
        
        <div class="sidebar-projects" id="projectsList" style="font-size: 16px;">
            <!-- Projetos serão inseridos aqui -->
        </div>
    </nav>
    
    <div class="sidebar-footer">
        <button class="sidebar-item" id="sidebarDarkMode">
            <i class="bi bi-moon"></i>
            <span>Modo Escuro</span>
        </button>
    </div>
</aside>

<!-- Main Content -->
<main class="main-content " id="mainContent" >
    <div class="main-header mx-auto" style="width: calc(96% - 10rem)!important;">
        <h3 class="asimovian" id="currentProjectTitle">25m.in</h3>
        <div class="header-actions">
            <button id="addTask" class="btn rounded-pill border-0 btn-outline-dark me-2" style="font-size: 16px" title="Adicionar Tarefa">
                Adicionar
            </button>
            <button id="showCompleted" class="btn rounded-pill border-0 btn-outline-dark me-2" style="font-size: 16px" title="Concluídas">
                Concluídas
            </button>
            <button id="manageColumns" class="d-none btn rounded-pill border-0 btn-outline-dark me-2" title="Gerenciar Colunas">
                <i class="bi bi-columns-gap"></i>
            </button>

        </div>
    </div>
    
    <table class="table align-middle text-center mx-auto" style="width: calc(96% - 10rem)!important;" >
        <thead><tr id="tableHead"></tr></thead>
        <tbody id="taskTable"></tbody>
    </table>
</main>

<!-- Offcanvas Tarefas Concluídas -->
<div class="offcanvas offcanvas-bottom" tabindex="-1" id="completedCanvas" style="height:50%">
    <div class="offcanvas-header">
        <h5 class="offcanvas-title">Tarefas Concluídas</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
        <table>
            <thead><tr id="completedHead"></tr></thead>
            <tbody id="completedTable"></tbody>
        </table>
    </div>
</div>

<!-- Modal Gerenciar Colunas -->
<div class="modal fade" id="columnsModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Gerenciar Colunas</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="input-group mb-3">
                    <input id="newColumnName" type="text" class="form-control" placeholder="Nova coluna">
                    <button class="btn btn-success" id="addColumn">Adicionar</button>
                </div>
                <table>
                    <thead><tr><th>Nome</th><th>Ações</th></tr></thead>
                    <tbody id="columnsTable"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Modal Adicionar Projeto -->
<div class="modal fade" id="projectModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-sm">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Novo Projeto</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input id="newProjectName" type="text" class="form-control" placeholder="Nome do projeto">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-primary" id="confirmAddProject">Criar</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal Atividades -->
<div class="modal fade" id="activitiesModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Atividades</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <table>
                    <thead>
                    <tr>
                        <th>Início</th>
                        <th>Fim</th>
                        <th>Total</th>
                        <th>Descrição</th>
                    </tr>
                    </thead>
                    <tbody id="activitiesTable"></tbody>
                </table>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Fechar</button>
            </div>
        </div>
    </div>
</div>

<video id="pip-timer" width="200" height="100" muted style="display:none;"></video>
<audio id="tickAudio" preload="none" src="tick.mp3"></audio>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="app2.js"></script>
</body>
</html>
